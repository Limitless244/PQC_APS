# Chat Lab configuration
spring.application.name=chat-lab

# Default TCP ports (all 127.0.0.1 only)
client.tcp.targetPort=9000
attacker.tcp.listenPort=9000
attacker.tcp.targetPort=9001
server.tcp.port=9001

# Logging
logging.level.com.pqcaps=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.SseEmitter=WARN
logging.level.org.springframework.web.context.request.async=DEBUG
